<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام بوالص الشحن | elsoooq</title>
  
  <!-- خطوط وأيقونات مطابقة -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
  
  <!-- مكتبات إخراج الصور و PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --primary-navy: #0e3b64;
      --accent-blue: #0288d1;
      --sky-border: #b8daf3;
      --light-blue-fill: #e1f0fa;
      --table-border: #9ecbed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      background: radial-gradient(circle at top left, #122b49, #09111e);
      min-height: 100vh;
      padding: 15px;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      gap: 25px;
    }

    /* ==================== لوحة الإدخال الزجاجية الحديثة ==================== */
    .glass-panel {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      color: #fff;
    }

    .glass-panel h2 {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 10px;
      color: #38bdf8;
    }

    .btn-new-id {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #e2e8f0;
    }

    .glass-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 8px 12px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      transition: 0.2s ease;
    }

    .glass-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.82rem;
    }

    .glass-input:focus {
      border-color: #38bdf8;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .form-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-action {
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #fff;
      transition: 0.2s;
    }

    .btn-print {
      grid-column: span 2;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      font-size: 0.95rem;
      padding: 12px;
    }

    .btn-img {
      background: linear-gradient(135deg, #059669, #047857);
    }

    .btn-pdf {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
    }

    .btn-action:active {
      transform: scale(0.97);
    }

    /* ==================== تصميم الفاتورة المطابق للأصل ==================== */
    .preview-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: center;
    }

    .invoice-card {
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    /* الهيدر العلوي */
    .header-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 20px 20px 10px 0;
    }

    .brand-logo-box {
      padding-right: 20px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 2.3rem;
      font-weight: 900;
      color: var(--primary-navy);
      letter-spacing: -1px;
      line-height: 1;
    }

    .brand-logo i {
      color: #0091ea;
    }

    .brand-slogan {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary-navy);
      margin-top: 5px;
    }

    /* بادج فاتورة بيع */
    .invoice-title-badge {
      background: var(--primary-navy);
      color: #ffffff;
      padding: 8px 20px 12px 28px;
      border-top-left-radius: 28px;
      border-bottom-left-radius: 28px;
      min-width: 215px;
      text-align: right;
    }

    .invoice-title-badge h1 {
      font-size: 1.55rem;
      font-weight: 900;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
    }

    .invoice-title-badge .meta-item {
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 6px;
      margin-top: 3px;
    }

    .invoice-title-badge .meta-item i {
      font-size: 0.85rem;
    }

    .inv-body {
      padding: 10px 20px;
    }

    /* الكروت المحاطة ببادج علوي مقوس من جهة واحدة */
    .bordered-card {
      border: 1.5px solid var(--sky-border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 18px;
      position: relative;
    }

    .card-badge {
      position: absolute;
      top: -14px;
      left: 15px;
      background: var(--primary-navy);
      color: white;
      padding: 2px 22px;
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
      border-top-right-radius: 12px;
      border-bottom-right-radius: 0;
      font-size: 0.88rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* بيانات العميل */
    .customer-grid {
      display: flex;
      align-items: center;
    }

    .customer-avatar {
      background: var(--light-blue-fill);
      color: var(--primary-navy);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      margin-left: 20px;
      flex-shrink: 0;
    }

    .customer-lines {
      flex: 1;
    }

    .info-line {
      display: flex;
      font-size: 0.95rem;
      margin-bottom: 5px;
    }

    .info-line:last-child {
      margin-bottom: 0;
    }

    .info-line .label {
      width: 95px;
      font-weight: 800;
      color: var(--primary-navy);
      flex-shrink: 0;
    }

    .info-line .val {
      font-weight: 700;
      color: #1a202c;
      word-break: break-word;
    }

    /* تفاصيل الطلب */
    .order-box-grid {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 0;
    }

    .order-col {
      text-align: center;
    }

    .order-col .head {
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--primary-navy);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .order-col .data {
      font-weight: 700;
      font-size: 0.95rem;
      color: #111;
    }

    /* جدول الأصناف */
    .items-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 6px;
      overflow: hidden;
      border: 1.5px solid var(--table-border);
      margin-bottom: 14px;
    }

    .items-table thead th {
      background: var(--primary-navy);
      color: white;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 8px 6px;
      border-left: 1.5px solid rgba(255, 255, 255, 0.25);
    }

    .items-table thead th:last-child {
      border-left: none;
    }

    .items-table tbody td {
      padding: 10px 6px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #111;
      text-align: center;
      border-left: 1.5px solid var(--table-border);
    }

    .items-table tbody td:last-child {
      border-left: none;
    }

    /* بنر المبلغ الإجمالي */
    .total-banner {
      background: var(--primary-navy);
      color: white;
      border-radius: 8px;
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .total-banner .lbl {
      font-size: 1.15rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .total-banner .lbl i {
      font-size: 1.4rem;
    }

    .total-banner .val {
      font-size: 1.35rem;
      font-weight: 900;
    }

    /* الملاحظة */
    .note-box {
      border: 1.5px solid var(--sky-border);
      border-radius: 8px;
      padding: 10px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--primary-navy);
      margin-bottom: 15px;
    }

    .note-badge {
      position: absolute;
      top: -13px;
      left: 15px;
      background: #ffffff;
      border: 1.5px solid var(--sky-border);
      border-radius: 12px;
      padding: 1px 12px;
      font-size: 0.78rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* التذييل: الهاتف + المميزات + الختم الأصلي */
    .footer-extra {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1.5px dashed var(--sky-border);
      padding: 12px 0 6px 0;
    }

    .company-phone {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .phone-icon-bg {
      background: var(--primary-navy);
      color: white;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    .phone-text .title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--primary-navy);
    }

    .phone-text .number {
      font-size: 0.9rem;
      font-weight: 800;
      color: #000;
      direction: ltr;
    }

    .perks-list {
      display: flex;
      gap: 12px;
    }

    .perk-item {
      text-align: center;
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--primary-navy);
    }

    .perk-item i {
      display: block;
      font-size: 1.1rem;
      margin-bottom: 3px;
      color: var(--primary-navy);
    }

    /* ================= الختم الأصلي الدائري المطابق تماماً ================= */
    .original-stamp-wrapper {
      width: 78px;
      height: 78px;
      transform: rotate(-10deg);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .original-stamp {
      width: 76px;
      height: 76px;
      border: 1.8px solid var(--primary-navy);
      border-radius: 50%;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .original-stamp-inner {
      width: 100%;
      height: 100%;
      border: 1px dashed var(--primary-navy);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--primary-navy);
      position: relative;
    }

    .stamp-top-text {
      font-size: 0.55rem;
      font-weight: 900;
      line-height: 1;
      margin-top: 2px;
    }

    .stamp-center {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin: 1px 0;
    }

    .stamp-center .star {
      font-size: 0.45rem;
    }

    .stamp-center-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stamp-center-logo i {
      font-size: 0.75rem;
      color: #0088cc;
    }

    .stamp-brand-name {
      font-size: 0.65rem;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.3px;
    }

    .stamp-bottom-text {
      font-size: 0.48rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 2px;
    }

    /* ================= شريط الشكر السفلي ================= */
    .bottom-blue-bar {
      background: linear-gradient(90deg, #0288d1 0%, #0e3b64 100%);
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .bottom-blue-bar .thanks-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .bottom-blue-bar .thanks-msg {
      font-family: 'Reem Kufi', 'Cairo', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .bottom-blue-bar .thanks-heart {
      font-size: 0.7rem;
      margin-top: 1px;
    }

    /* تجاوب الهاتف */
    @media screen and (max-width: 860px) {
      body {
        flex-direction: column;
        align-items: center;
        padding: 10px;
        gap: 20px;
      }
      .glass-panel, .preview-container {
        max-width: 100%;
      }
    }

    /* إعدادات الطباعة على ورق البوالص */
    @page {
      size: auto;
      margin: 0mm;
    }

    @media print {
      html, body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
      }

      .glass-panel, .no-print {
        display: none !important;
      }

      .preview-container {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
      }

      .invoice-card {
        width: 100% !important;
        max-width: 100% !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        border: none !important;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>

  <!-- لوحة الإدخال الزجاجية (فارغة وجاهزة) -->
  <div class="glass-panel">
    <h2>
      <span><i class="fa-solid fa-pen-to-square"></i> بوليصة شحن جديدة</span>
      <button class="btn-new-id" onclick="generateInvoiceMeta()" title="توليد رقم وتاريخ جديد">
        <i class="fa-solid fa-arrows-rotate"></i> جديد
      </button>
    </h2>

    <div class="form-group">
      <label><i class="fa-solid fa-user"></i> اسم العميل</label>
      <input type="text" id="inCustName" class="glass-input" placeholder="اكتب اسم العميل...">
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-phone"></i> تليفون العميل</label>
      <input type="tel" id="inCustPhone" class="glass-input" placeholder="01xxxxxxxxx">
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-location-dot"></i> عنوان العميل</label>
      <input type="text" id="inCustAddress" class="glass-input" placeholder="المدينة - المنطقة - الشارع...">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label><i class="fa-solid fa-box-open"></i> النوع (اسم المنتج)</label>
        <input type="text" id="inProdName" class="glass-input" placeholder="اسم المنتج...">
      </div>
      <div class="form-group">
        <label><i class="fa-solid fa-arrow-up-1-9"></i> العدد</label>
        <input type="number" id="inProdQty" class="glass-input" placeholder="1" min="1">
      </div>
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-money-bill-wave"></i> مبلغ التحصيل (ج.م)</label>
      <input type="number" id="inTotalAmount" class="glass-input" placeholder="المبلغ المطلوب تحصيله...">
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-comment-dots"></i> ملحوظة</label>
      <input type="text" id="inNote" class="glass-input" placeholder="متاح معاينة المنتج قبل الدفع">
    </div>

    <!-- أزرار الإخراج الثلاثة -->
    <div class="actions-grid">
      <button type="button" class="btn-action btn-print" onclick="window.print()">
        <i class="fa-solid fa-print"></i> طباعة البوليصة مباشرة
      </button>

      <button type="button" class="btn-action btn-img" onclick="exportAsImage()">
        <i class="fa-solid fa-image"></i> حفظ كصورة PNG
      </button>

      <button type="button" class="btn-action btn-pdf" onclick="exportAsPDF()">
        <i class="fa-solid fa-file-pdf"></i> حفظ كملف PDF
      </button>
    </div>
  </div>

  <!-- معاينة البوليصة المطابقة 100% -->
  <div class="preview-container">
    <div class="invoice-card" id="invoiceArea">
      
      <!-- الهيدر -->
      <div class="header-section">
        <div class="brand-logo-box">
          <div class="brand-logo">
            <i class="fa-solid fa-cart-shopping"></i> elsoooq
          </div>
          <div class="brand-slogan">اختياراتك الأفضل .. دائماً</div>
        </div>

        <div class="invoice-title-badge">
          <h1>فاتورة بيع</h1>
          <div class="meta-item">
            رقم الفاتورة: <span id="outInvNumber">#000482</span>
          </div>
          <div class="meta-item">
            <i class="fa-regular fa-calendar-days"></i> التاريخ: <span id="outDate">--</span>
          </div>
        </div>
      </div>

      <div class="inv-body">
        
        <!-- كارت بيانات العميل -->
        <div class="bordered-card">
          <div class="card-badge">
            <i class="fa-solid fa-user"></i> بيانات العميل
          </div>
          <div class="customer-grid">
            <div class="customer-avatar">
              <i class="fa-solid fa-user"></i>
            </div>
            <div class="customer-lines">
              <div class="info-line">
                <span class="label">اسم العميل :</span>
                <span class="val" id="outCustName">---</span>
              </div>
              <div class="info-line">
                <span class="label">العنوان :</span>
                <span class="val" id="outCustAddress">---</span>
              </div>
              <div class="info-line">
                <span class="label">رقم الهاتف :</span>
                <span class="val" id="outCustPhone">---</span>
              </div>
            </div>
          </div>
        </div>

        <!-- كارت تفاصيل الطلب -->
        <div class="bordered-card">
          <div class="card-badge">
            <i class="fa-regular fa-newspaper"></i> تفاصيل الطلب
          </div>
          <div class="order-box-grid">
            <div class="order-col">
              <div class="head">طريقة الدفع:</div>
              <div class="data">
                كاش عند الاستلام 
                <span style="display:inline-block; border:1px solid #111; border-radius:3px; padding:0 3px; font-size:0.75rem; margin-right:4px;">💵</span>
              </div>
            </div>
            <div class="order-col">
              <div class="head">
                تاريخ الطلب:
                <i class="fa-regular fa-calendar-days" style="color:var(--primary-navy); font-size:1.1rem; margin-right:4px;"></i>
              </div>
              <div class="data" id="outOrderDate">--</div>
            </div>
          </div>
        </div>

        <!-- جدول الأصناف المطابق تماماً -->
        <table class="items-table">
          <thead>
            <tr>
