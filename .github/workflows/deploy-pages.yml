name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp 404.html _site/404.html 2>/dev/null || true
          cp CNAME _site/CNAME 2>/dev/null || true
          cp public/robots.txt _site/robots.txt 2>/dev/null || true
          cp public/favicon.ico _site/favicon.ico 2>/dev/null || true
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4