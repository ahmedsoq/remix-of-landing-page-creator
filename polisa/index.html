<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بوليصة شحن - elsoooq</title>
  
  <!-- خط Cairo الأصلي وأيقونات FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Changa:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- مكتبات التصدير لصورة و PDF فوري -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --c-navy: #0e3b64;
      --c-blue: #0288d1;
      --c-sky: #9ecbed;
      --c-light-bg: #e1f0fa;
      --c-border: #b8daf3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      background: radial-gradient(circle at top left, #122b49, #08101a);
      min-height: 100vh;
      padding: 15px;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
    }

    /* ==================== لوحة الإدخال الزجاجية العصرية ==================== */
    .glass-form-card {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      color: #fff;
    }

    .glass-form-card h2 {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 8px;
      color: #38bdf8;
    }

    .btn-refresh-meta {
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .f-group {
      margin-bottom: 9px;
    }

    .f-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 3px;
      color: #cbd5e1;
    }

    .g-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      padding: 7px 10px;
      color: #ffffff;
      font-size: 0.88rem;
      outline: none;
    }

    .g-input::placeholder {
      color: rgba(255, 255, 255, 0.38);
      font-size: 0.8rem;
    }

    .g-input:focus {
      border-color: #38bdf8;
      background: rgba(255, 255, 255, 0.14);
    }

    .f-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-g {
      border: none;
      border-radius: 8px;
      padding: 9px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: #fff;
    }

    .btn-print-action {
      grid-column: span 2;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      font-size: 0.95rem;
      padding: 11px;
    }

    .btn-img-action { background: linear-gradient(135deg, #059669, #047857); }
    .btn-pdf-action { background: linear-gradient(135deg, #dc2626, #b91c1c); }

    /* ==================== تصميم بوليصة الشحن المطابقة 100% ==================== */
    .invoice-stage {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: center;
    }

    /* أبعاد ثابتة محكمة تمنع تعدد الصفحات */
    .bill-box {
      width: 480px;
      background: #ffffff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      position: relative;
      direction: rtl !important;
      color: #0e3b64;
    }

    /* رأس الفاتورة */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      direction: rtl;
    }

    /* بادج فاتورة بيع - الزاوية العلوية اليمنى بالصورة الأصلية */
    .bill-title-tab {
      background: var(--c-navy);
      color: #ffffff;
      padding: 12px 18px 12px 24px;
      border-bottom-left-radius: 35px;
      min-width: 190px;
      text-align: right;
    }

    .bill-title-tab h1 {
      font-size: 1.5rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .bill-title-tab .meta-line {
      font-size: 0.76rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
    }

    /* اللوجو وشعار المتجر - الزاوية العلوية اليسرى */
    .brand-top-left {
      padding: 14px 18px 0 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .brand-top-left .logo-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 2.1rem;
      font-weight: 900;
      color: var(--c-navy);
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .brand-top-left .logo-row i {
      color: var(--c-blue);
      font-size: 1.9rem;
    }

    .brand-top-left .brand-slogan {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--c-navy);
      margin-top: 4px;
    }

    /* المحتوى الداخلي */
    .bill-inner-body {
      padding: 10px 14px 8px 14px;
    }

    /* الكروت المؤطرة */
    .sec-card {
      border: 1.5px solid var(--c-border);
      border-radius: 12px;
      padding: 12px 14px 10px 14px;
      margin-bottom: 12px;
      position: relative;
    }

    /* البادج العلوي على يمين الكرت كما بالصورة الأصلية تماماً */
    .sec-badge-tab {
      position: absolute;
      top: -13px;
      right: 18px;
      background: var(--c-navy);
      color: white;
      padding: 2px 18px 2px 24px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* كرت بيانات العميل */
    .cust-layout {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cust-lines-col {
      flex: 1;
      text-align: right;
    }

    .cust-line {
      display: flex;
      align-items: center;
      font-size: 0.88rem;
      margin-bottom: 4px;
    }

    .cust-line:last-child { margin-bottom: 0; }

    .cust-lbl {
      width: 90px;
      font-weight: 800;
      color: var(--c-navy);
      flex-shrink: 0;
    }

    .cust-val {
      font-weight: 700;
      color: #111;
      word-break: break-word;
    }

    .cust-avatar-circle {
      background: var(--c-light-bg);
      color: var(--c-navy);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-right: 10px;
      flex-shrink: 0;
    }

    /* كرت تفاصيل الطلب */
    .order-split-row {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 4px 0 2px 0;
    }

    .order-unit {
      text-align: center;
    }

    .order-unit .u-title {
      font-weight: 800;
      font-size: 0.84rem;
      color: var(--c-navy);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-bottom: 4px;
    }

    .order-unit .u-value {
      font-weight: 800;
      font-size: 0.88rem;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* أيقونة النقود الزرقاء للـ 50 */
    .cash-badge-icon {
      border: 1.5px solid var(--c-blue);
      color: var(--c-blue);
      border-radius: 3px;
      padding: 0 4px;
      font-size: 0.72rem;
      font-weight: 900;
      line-height: 1.2;
    }

    /* جدول الأصناف المطابق */
    .bill-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 6px;
      overflow: hidden;
      border: 1.5px solid var(--c-sky);
      margin-bottom: 10px;
    }

    .bill-table thead th {
      background: var(--c-navy);
      color: white;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 6px 4px;
      border-left: 1.5px solid rgba(255, 255, 255, 0.25);
    }

    .bill-table thead th:last-child { border-left: none; }

    .bill-table tbody td {
      padding: 8px 4px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #111;
      text-align: center;
      border-left: 1.5px solid var(--c-sky);
    }

    .bill-table tbody td:last-child { border-left: none; }

    /* بنر المبلغ الإجمالي */
    .total-navy-strip {
      background: var(--c-navy);
      color: white;
      border-radius: 6px;
      padding: 7px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .total-navy-strip .t-lbl {
      font-size: 1.1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .total-navy-strip .t-lbl i {
      font-size: 1.35rem;
    }

    .total-navy-strip .t-val {
      font-size: 1.25rem;
      font-weight: 900;
    }

    /* كرت الملاحظة */
    .note-rect-card {
      border: 1.5px solid var(--c-border);
      border-radius: 8px;
      padding: 7px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--c-navy);
      margin-bottom: 10px;
    }

    .note-pill-badge {
      position: absolute;
      top: -11px;
      right: 14px;
      background: #ffffff;
      border: 1.5px solid var(--c-border);
      border-radius: 12px;
      padding: 0 10px;
      font-size: 0.74rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* القسم السفلي: هاتف ومميزات وختم المتجر */
    .bottom-perks-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1.5px dashed var(--c-sky);
      padding: 8px 0 4px 0;
    }

    .comp-call-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .call-circle-icon {
      background: var(--c-navy);
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    .call-meta .c-title {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--c-navy);
    }

    .call-meta .c-num {
      font-size: 0.82rem;
      font-weight: 800;
      color: #000;
      direction: ltr;
    }

    .three-perks-wrap {
      display: flex;
      gap: 10px;
    }

    .perk-cell {
      text-align: center;
      font-size: 0.65rem;
      font-weight: 800;
      color: var(--c-navy);
    }

    .perk-cell i {
      display: block;
      font-size: 1rem;
      margin-bottom: 2px;
      color: var(--c-navy);
    }

    /* الختم الدائري المطابق للأصل */
    .authentic-stamp {
      width: 70px;
      height: 70px;
      border: 1.8px solid var(--c-navy);
      border-radius: 50%;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-10deg);
      user-select: none;
    }

    .authentic-stamp-inner {
      width: 100%;
      height: 100%;
      border: 1px dashed var(--c-navy);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--c-navy);
    }

    .stamp-ar-top {
      font-size: 0.52rem;
      font-weight: 900;
      line-height: 1;
    }

    .stamp-mid-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      margin: 1px 0;
    }

    .stamp-mid-row .st-star { font-size: 0.38rem; }
    .stamp-mid-row i.fa-cart-shopping { font-size: 0.7rem; color: var(--c-blue); }
    .stamp-brand-txt { font-size: 0.6rem; font-weight: 900; line-height: 1; }

    .stamp-ar-bot {
      font-size: 0.45rem;
      font-weight: 800;
      line-height: 1;
    }

    /* الشريط السفلي الأزرق */
    .foot-gradient-bar {
      background: linear-gradient(90deg, #0288d1 0%, #0e3b64 100%);
      color: white;
      padding: 7px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .foot-gradient-bar .thanks-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
    }

    .foot-gradient-bar .thanks-cell .t-txt {
      font-size: 0.95rem;
      font-weight: 800;
    }

    .foot-gradient-bar .thanks-cell .t-heart {
      font-size: 0.55rem;
      margin-top: 2px;
    }

    /* ==================== استجابة الهاتف والشاشات الصغيرة ==================== */
    @media screen and (max-width: 860px) {
      body {
        flex-direction: column;
        align-items: center;
        padding: 8px;
        gap: 15px;
      }
      .glass-form-card, .invoice-stage {
        max-width: 100%;
      }
      .bill-box {
        width: 100%;
        max-width: 480px;
      }
    }

    /* ==================== قواعد الطباعة: صفحة واحدة فقط بدون تقطيع ==================== */
    @page {
      size: A4 portrait;
      margin: 5mm auto;
    }

    @media print {
      html, body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: auto !important;
        min-height: auto !important;
        overflow: visible !important;
        display: block !important;
      }

      .glass-form-card, .no-print {
        display: none !important;
      }

      .invoice-stage {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 auto !important;
        padding: 0 !important;
        display: flex !important;
        justify-content: center !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
      }

      .bill-box {
        width: 480px !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        border: 1px solid #ccc !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }
  </style>
</head>
<body>

  <!-- لوحة الإدخال الزجاجية (فارغة تماماً وجاهزة) -->
  <div class="glass-form-card">
    <h2>
      <span><i class="fa-solid fa-pen-to-square"></i> بوليصة شحن جديدة</span>
      <button class="btn-refresh-meta" onclick="generateMeta()" title="توليد رقم وتاريخ جديد">
        <i class="fa-solid fa-arrows-rotate"></i> جديد
      </button>
    </h2>

    <div class="f-group">
      <label><i class="fa-solid fa-user"></i> اسم العميل</label>
      <input type="text" id="inCustName" class="g-input" placeholder="اكتب اسم العميل...">
    </div>

    <div class="f-group">
      <label><i class="fa-solid fa-phone"></i> تليفون العميل</label>
      <input type="tel" id="inCustPhone" class="g-input" placeholder="01xxxxxxxxx">
    </div>

    <div class="f-group">
      <label><i class="fa-solid fa-location-dot"></i> عنوان العميل</label>
      <input type="text" id="inCustAddress" class="g-input" placeholder="المحافظة - المنطقة - الشارع...">
    </div>

    <div class="f-row">
      <div class="f-group">
        <label><i class="fa-solid fa-box-open"></i> النوع (اسم المنتج)</label>
        <input type="text" id="inProdName" class="g-input" placeholder="اسم المنتج...">
      </div>
      <div class="f-group">
        <label><i class="fa-solid fa-arrow-up-1-9"></i> العدد</label>
        <input type="number" id="inProdQty" class="g-input" placeholder="1" min="1">
      </div>
    </div>

    <div class="f-group">
      <label><i class="fa-solid fa-money-bill-wave"></i> مبلغ التحصيل (ج.م)</label>
      <input type="number" id="inTotalAmount" class="g-input" placeholder="المبلغ المطلوب تحصيله...">
    </div>

    <div class="f-group">
      <label><i class="fa-solid fa-comment-dots"></i> ملحوظة</label>
      <input type="text" id="inNote" class="g-input" placeholder="متاح معاينة المنتج قبل الدفع">
    </div>

    <!-- أزرار الإخراج -->
    <div class="btn-grid">
      <button type="button" class="btn-g btn-print-action" onclick="window.print()">
        <i class="fa-solid fa-print"></i> طباعة فورية (صفحة واحدة)
      </button>
      <button type="button" class="btn-g btn-img-action" onclick="saveAsImage()">
        <i class="fa-solid fa-image"></i> حفظ كصورة PNG
      </button>
      <button type="button" class="btn-g btn-pdf-action" onclick="saveAsPDF()">
        <i class="fa-solid fa-file-pdf"></i> حفظ كملف PDF
      </button>
    </div>
  </div>

  <!-- حاوية المعاينة للبوليصة المطابقة 100% للصورة الأصلية -->
  <div class="invoice-stage">
    <div class="bill-box" id="billToExport">
      
      <!-- الهيدر العلوي: بادج الفاتورة يميناً والشعار يساراً كما بالصورة الأصلية -->
      <div class="top-header">
        
        <!-- بادج فاتورة بيع (يمين) -->
        <div class="bill-title-tab">
          <h1>فاتورة بيع</h1>
          <div class="meta-line">
            رقم الفاتورة: <span id="outInvNumber">#000482</span>
          </div>
          <div class="meta-line">
            <i class="fa-regular fa-calendar-days"></i> التاريخ: <span id="outDate">--</span>
          </div>
        </div>

        <!-- الشعار والسلوجان (يسار) -->
        <div class="brand-top-left">
          <div class="logo-row">
            <i class="fa-solid fa-cart-shopping"></i> elsoooq
          </div>
          <div class="brand-slogan">اختياراتك الأفضل .. دائماً</div>
        </div>

      </div>

      <div class="bill-inner-body">
        
        <!-- كارت بيانات العميل -->
        <div class="sec-card">
          <div class="sec-badge-tab">
            <i class="fa-solid fa-user"></i> بيانات العميل
          </div>
          <div class="cust-layout">
            <div class="cust-avatar-circle">
              <i class="fa-solid fa-user"></i>
            </div>
            <div class="cust-lines-col">
              <div class="cust-line">
                <span class="cust-lbl">اسم العميل :</span>
                <span class="cust-val" id="outCustName">---</span>
              </div>
              <div class="cust-line">
                <span class="cust-lbl">العنوان :</span>
                <span class="cust-val" id="outCustAddress">---</span>
              </div>
              <div class="cust-line">
                <span class="cust-lbl">رقم الهاتف :</span>
                <span class="cust-val" id="outCustPhone">---</span>
              </div>
            </div>
          </div>
        </div>

        <!-- كارت تفاصيل الطلب -->
        <div class="sec-card">
          <div class="sec-badge-tab">
            <i class="fa-regular fa-clipboard"></i> تفاصيل الطلب
          </div>
          <div class="order-split-row">
            <div class="order-unit">
              <div class="u-title">طريقة الدفع:</div>
              <div class="u-value">
                كاش عند الاستلام
                <span class="cash-badge-icon">50</span>
              </div>
            </div>
            <div class="order-unit">
              <div class="u-title">
                تاريخ الطلب:
                <i class="fa-regular fa-calendar-days" style="color:var(--c-navy); font-size:1rem; margin-right:3px;"></i>
