  var p = h.split("."); if(p.length < 2) return null;

function cookieGet(name){
  var m = document.cookie.match(new RegExp("(?:^|;\\s*)" + name + "=([^;]*)"));
  if(!m) return null;
  try{ return decodeURIComponent(m[1]); }catch(e){ return null; }
}

function tgSend(token, chat, text){
  token = String(token||"").trim(); chat = String(chat||"").trim();
  if(!token || !chat) return Promise.reject(new Error("لم يتم ضبط إعدادات الإشعارات بعد. افتح لوحة التحكم واحفظ التوكن وأيدي الشات."));
  return new Promise(function(resolve, reject){
    var id = "tg_" + Date.now();
    var frame = document.createElement("iframe");
    frame.name = id; frame.style.display = "none";
    var form = document.createElement("form");
    form.method = "POST"; form.target = id; form.style.display = "none";
    form.action = "https://api.telegram.org/bot" + token + "/sendMessage";
    [["chat_id",chat],["text",text],["disable_web_page_preview","true"]].forEach(function(pair){
      var input = document.createElement("input"); input.name = pair[0]; input.value = pair[1]; form.appendChild(input);
    });
    var done = false;
    function finish(){ if(done) return; done = true; setTimeout(function(){ frame.remove(); form.remove(); },500); resolve({ok:true}); }
    frame.onload = function(){ setTimeout(finish,350); };
    frame.onerror = function(){ reject(new Error("تعذر الاتصال بتيليجرام. تحقق من الإنترنت ثم حاول مرة أخرى.")); };
    document.body.appendChild(frame); document.body.appendChild(form); form.submit();
    setTimeout(finish,3500);
  });
}

function buildSlider(p){
  var slider = document.getElementById("slider"), dots = document.getElementById("dots");
  var G = (p.images && p.images.length) ? p.images : [["", p.name]];
  cur = 0;
  G.forEach(function(g,i){
    var im = document.createElement("img");
    im.src = g[0]; im.alt = g[1] || p.name; im.loading = i===0?"eager":"lazy"; im.decoding = "async";
    if(i===0){ im.fetchPriority = "high"; im.className = "on"; }
    slider.appendChild(im);
    var b = document.createElement("button");
    b.setAttribute("aria-label", g[1] || p.name); if(i===0) b.className="on";
    b.onclick = function(){ show(i); };
    dots.appendChild(b);
  });
  var cap = document.createElement("div"); cap.className = "cap"; cap.textContent = G[0][1] || ""; slider.appendChild(cap);
  function show(i){
    cur = i;
    var imgs = slider.querySelectorAll("img"), bs = dots.querySelectorAll("button");
    for(var k=0;k<imgs.length;k++){ imgs[k].className = (k===i?"on":""); bs[k].className = (k===i?"on":""); }
    cap.textContent = G[i][1] || "";
  }
  if(slideInt){ clearInterval(slideInt); slideInt = null; }
  if(G.length > 1){
    slideInt = setInterval(function(){ show((cur+1)%G.length); }, 2600);
    if("IntersectionObserver" in window){
      new IntersectionObserver(function(es){ es.forEach(function(e){
        if(e.isIntersecting){ if(!slideInt) slideInt = setInterval(function(){ show((cur+1)%G.length); }, 2600); }
        else { clearInterval(slideInt); slideInt = null; }
      }); }).observe(slider);
    }
  }
}

/* ============ عناصر التحفيز على الشراء ============ */
function startUrgency(){
  var pid = CUR ? CUR.id : "x";
  var HRS = (CUR && Number(CUR.hours)) ? Number(CUR.hours) : 4;
  var SPAN = HRS*3600*1000;
  var CD = "cd_" + pid;
  var end = parseInt(localStorage.getItem(CD) || "0", 10);
  if(!end || end < Date.now()) { end = Date.now() + SPAN; try{ localStorage.setItem(CD, String(end)); }catch(e){} }
  function two(n){ return n < 10 ? "0"+n : ""+n; }
  function tick(){
    var el = document.getElementById("cdown"); if(!el) return;
    var s = Math.max(0, Math.floor((end - Date.now())/1000));
    if(s === 0){ end = Date.now() + SPAN; try{ localStorage.setItem(CD, String(end)); }catch(e){} }
    el.textContent = two(Math.floor(s/3600))+":"+two(Math.floor(s%3600/60))+":"+two(s%60);
  }
  tick();
  var SK = "stk_" + pid, st = parseInt(localStorage.getItem(SK) || "0", 10);
  var base = (CUR && Number(CUR.stock)) ? Number(CUR.stock) : 0;
  if(base) st = base;
  else if(!st || st < 4){ st = 5 + Math.floor(Math.random()*5); try{ localStorage.setItem(SK, String(st)); }catch(e){} }
  var sEl = document.getElementById("stock"); if(sEl) sEl.textContent = st;


  if(urgStarted) return;
  urgStarted = true;
  setInterval(tick, 1000);
  var names = ["أحمد","محمود","مصطفى","سارة","كريم","إسلام","هبة","عمرو","ياسمين","خالد"];
  var govs = ["القاهرة","الجيزة","الإسكندرية","الدقهلية","الشرقية","أسيوط","المنوفية","بورسعيد"];
  var msgs = 0;
  setInterval(function(){
    var pf = document.getElementById("proof"); if(!pf) return;
    var sp = pf.querySelector("span"); if(!sp) return;
    msgs++;
    sp.textContent = (msgs % 4 === 0)
      ? "🔥 تم شراء " + (18 + Math.floor(Math.random()*12)) + " قطعة اليوم"
      : "👤 " + names[Math.floor(Math.random()*names.length)] + " من " + govs[Math.floor(Math.random()*govs.length)] + " طلب منذ " + (1 + Math.floor(Math.random()*9)) + " دقائق";
  }, 4500);
  window.addEventListener("scroll", function(){
    var bar = document.getElementById("stickyBar");
    var show = CUR && window.scrollY > 320 && !document.getElementById("orderOverlay").classList.contains("on");
    bar.classList.toggle("on", !!show);
  }, {passive:true});
}

/* تصغير وضغط الصورة المرفوعة قبل الحفظ */
function shrinkImage(file, cb){
  if(!file || !/^image\//.test(file.type)) return cb(null);
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 900, w = img.width, h = img.height;
      if(w > max || h > max){ var r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r); }
      var c = document.createElement("canvas"); c.width = w; c.height = h;
      var x = c.getContext("2d"); x.fillStyle = "#0b0b12"; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
      try{ cb(c.toDataURL("image/jpeg", 0.72)); }catch(e){ cb(fr.result); }
    };
    img.onerror = function(){ cb(null); };
    img.src = fr.result;
  };
  fr.onerror = function(){ cb(null); };
  fr.readAsDataURL(file);
}

    ["v_total","v_unique","v_today"].forEach(function(id){ var e=document.getElementById(id); if(e) e.textContent="…"; });
    [["visits","v_total"],["unique","v_unique"],[vcKeyToday(),"v_today"]].forEach(function(pr){
      vcGet(pr[0]).then(function(n){ var e=document.getElementById(pr[1]); if(e) e.textContent = (n===null?"—":String(n)); });
    });
    loadViews(function(){
      var box = document.getElementById("v_products"); if(!box) return;
      box.innerHTML = allProducts().map(function(p){
        return '<div class="arow"><span>'+esc(p.name)+'</span><small>'+(VIEWS[p.id]||0)+' زيارة</small></div>';
      }).join("");
    });
  }
  loadVisits();
  document.getElementById("a_vrefresh").onclick = loadVisits;

  function draft(){
    var d = Object.assign({}, S);
    document.querySelectorAll('#adminMount [data-k]').forEach(function(i){ d[i.getAttribute("data-k")] = i.value; });
    return d;
  }
  document.getElementById("a_save").onclick = function(){
    save(draft());
    document.getElementById("a_msg").textContent = "✅ تم الحفظ والتطبيق";
  };
  document.getElementById("a_test").onclick = function(){
    save(draft());
    var out = document.getElementById("a_msg");
    out.textContent = "جاري الحفظ والاختبار...";
    tgSend(S.botToken, S.chatId, "✅ تجربة اتصال ناجحة — الإعدادات محفوظة وطلبات الموقع ستصلك هنا")
      .then(function(){ out.textContent = "✅ تم الحفظ وإرسال رسالة تجربة"; })
      .catch(function(e){ out.textContent = "❌ " + (e.message || "فشل الاتصال"); });
  };
  document.getElementById("a_export").onclick = function(){
    var configured = draft(); save(configured);
    downloadConfiguredPage(configured, customProducts());
  };

  /* ==== منطق مولد المنتجات ==== */
  function pdraft(){
    var d = {};
    document.querySelectorAll('#adminMount [data-p]').forEach(function(i){ d[i.getAttribute("data-p")] = i.value; });
    return d;
  }
  function parseLines(v, n){
    return String(v||"").split("\n").map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
      var parts = l.split("|").map(function(x){ return x.trim(); });
      while(parts.length < n) parts.push("");
      return parts.slice(0,n);
    });
  }
  document.getElementById("p_clear").onclick = function(){ EDIT = emptyForm(); UPLOADS = []; panel(); };
  document.getElementById("p_tpl").onclick = function(){
    EDIT = {
      id:"", name:"كاميرا مراقبة جيب 1080P", price:"1200", oldPrice:"1900", badge:"الأكثر مبيعاً",
      desc:"كاميرا صغيرة تسجل صوت وصورة بجودة 1080P بدون إنترنت — رؤية ليلية ومشبك معدني قوي، تشتغل في أي مكان.",
      stock:"7", hours:"4", images:"",
      features:"🎥 | جودة التصوير 1080P | تصوير صوت وصورة بوضوح عالي نهاراً وليلاً\n💾 | تخزين على الميموري | يمكن تخزين كل شيء على كارت ميموري حتى 128 جيجا\n🔋 | بطارية قوية | تدوم 4 ساعات ونصف تصوير متواصل\n✋ | سهولة الاستخدام | يمكن استخدامها في أي مكان مخفي بمشبك معدني",
      video:"Rahad6F_gNQ", tiers:"0,100,200"
    };
    UPLOADS = []; panel();
  };
  var fileInput = document.getElementById("p_files");
  document.getElementById("p_zone").onclick = function(){ fileInput.click(); };
  fileInput.onchange = function(){
    var fs = Array.prototype.slice.call(fileInput.files || []);
    if(!fs.length) return;
    var out = document.getElementById("p_msg");
    out.textContent = "جاري معالجة الصور...";
    var left = fs.length;
    fs.forEach(function(f){
      shrinkImage(f, function(url){
        if(url) UPLOADS.push([url, ""]);
        if(--left === 0){ fileInput.value = ""; out.textContent = "✅ تم إضافة الصور — راجع المعاينة ثم اضغط حفظ المنتج"; drawUploads(); }
      });
    });
  };
  drawUploads();
  document.getElementById("p_save").onclick = function(){
    var d = pdraft(), msg = document.getElementById("p_msg");
    if(!d.name || !d.name.trim()) { msg.textContent = "اكتب اسم المنتج"; return; }
    if(!Number(d.price)) { msg.textContent = "اكتب سعر صحيح"; return; }
    var imgs = UPLOADS.map(function(g){ return [g[0], g[1]||""]; }).concat(parseLines(d.images, 2));
    if(!imgs.length) { msg.textContent = "ارفع صورة واحدة على الأقل"; return; }
    var tv = String(d.tiers||"0,100,200").split(",").map(function(x){ return Number(x.trim())||0; });
    var tiers = [1,2,3].map(function(q,i){
      var dd = tv[i]||0;
      return [q, dd, dd ? ("خصم " + dd + " ج") : ""];
    });
    var prod = {
      id: String(d.id && d.id.trim() ? d.id.trim().replace(/\D/g,"") : nextId()),
      name: d.name.trim(),
      price: Number(d.price), oldPrice: Number(d.oldPrice)||0,
      badge: (d.badge||"").trim(),
      images: imgs,
      desc: (d.desc||"").trim(),
      stock: Number(d.stock)||0,
      hours: Number(d.hours)||0,
      features: parseLines(d.features, 3).slice(0,4),
      video: ytId(d.video||""),
      tiers: tiers
    };
    var list = customProducts();
    var i = list.findIndex(function(x){ return x.id === prod.id; });
    if(i > -1) list[i] = prod; else list.push(prod);
    try{ saveCustom(list); }
    catch(e){ msg.textContent = "❌ مساحة المتصفح ممتلئة — احذف منتجاً قديماً أو استخدم صور أقل"; return; }
    EDIT = emptyForm(); UPLOADS = [];
    msg.textContent = "✅ تم حفظ المنتج — رابطه: /" + prod.id;
    route();
  };

  var list = customProducts();
  document.getElementById("p_list").innerHTML = !list.length
    ? '<p style="font-size:12px;opacity:.7;margin:10px 0 0">لا توجد منتجات مضافة بعد.</p>'
    : list.map(function(p){
        return '<div class="arow">' +
          (p.images && p.images[0] ? '<img src="'+esc(p.images[0][0])+'" alt="">' : '') +
          '<span>'+esc(p.name)+'<br><small>/'+esc(p.id)+' — '+Number(p.price)+' ج</small></span>' +
          '<button data-edit="'+esc(p.id)+'" style="background:rgba(80,180,255,.25)">تعديل</button>' +
          '<button data-del="'+esc(p.id)+'">حذف</button></div>';
      }).join("");
  document.querySelectorAll('#p_list [data-del]').forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-del");
      saveCustom(customProducts().filter(function(x){ return x.id !== id; }));
      route();
    };
  });
  document.querySelectorAll('#p_list [data-edit]').forEach(function(b){
    b.onclick = function(){
      var p = customProducts().filter(function(x){ return x.id === b.getAttribute("data-edit"); })[0];
      if(!p) return;
      EDIT = {
        id:p.id, name:p.name, price:String(p.price), oldPrice:String(p.oldPrice||""), badge:p.badge||"",
        desc:p.desc||"", stock:String(p.stock||""), hours:String(p.hours||""),
        images:"",
        features:(p.features||[]).map(function(f){ return f.join(" | "); }).join("\n"),
        video:p.video||"",
        tiers:(p.tiers||[]).map(function(t){ return t[1]; }).join(",")
      };
      UPLOADS = (p.images||[]).map(function(g){ return [g[0], g[1]||""]; });
      panel();
      window.scrollTo(0, document.getElementById("adminMount").offsetTop);
    };
  });
}

/* ================= الإقلاع ================= */
document.getElementById("yr").textContent = new Date().getFullYear();
route();
trackVisit(currentId());
loadViews(function(){ if(!isAdmin()) route(); });
</script>
</body>
