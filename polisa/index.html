body{font-family:Arial;background:#eee;padding:10px;}
.container{max-width:600px;margin:auto;}
.box{background:#fff;padding:15px;border-radius:10px;margin-bottom:15px;}

input,select,textarea{
width:100%;
padding:12px;
margin:6px 0;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

.generate{background:#28a745;color:#fff;}
.print{background:#007bff;color:#fff;}
.pdf{background:#dc3545;color:#fff;}

.invoice{
display:none;
background:#fff;
padding:10px;
border:2px solid #000;
}

.section{border:1px solid #000;margin-top:10px;padding:8px;}
.row{display:flex;justify-content:space-between;border-bottom:1px solid #000;padding:4px;}
.center{text-align:center;}
.barcode{border:2px dashed #000;padding:10px;margin:10px;text-align:center;font-weight:bold;}
.company-info{font-size:14px;text-align:center;margin-top:10px;border-top:1px solid #000;padding-top:8px;}
.company-info a{color:#000;text-decoration:none;}
</style>

<div class="container">

<div class="box">
<h2>إنشاء بوليصة</h2>

<input id="name" placeholder="اسم العميل">
<input id="phone" placeholder="رقم العميل">

<select id="gov" onchange="loadCities()">
<option value="">اختر المحافظة</option>
</select>

<select id="city">
<option>اختر المركز</option>
</select>

<input id="street" placeholder="الشارع بالتفصيل">

<input id="product" placeholder="المنتج">
<input id="amount" placeholder="المبلغ">
<textarea id="note" placeholder="ملاحظة"></textarea>

<button class="generate" onclick="generate()">إنشاء البوليصة</button>
</div>

<div id="invoice" class="invoice">

<div class="center"><b>ELSOOOQ SHIPPING</b></div>
<div class="barcode" id="orderId"></div>

<div class="section">
<div class="row"><span>العميل</span><span id="c_name"></span></div>
<div class="row"><span>الهاتف</span><span id="c_phone"></span></div>
<div class="row"><span>العنوان</span><span id="c_address"></span></div>
</div>

<div class="section">
<div class="row"><span>المنتج</span><span id="c_product"></span></div>
<div class="row"><span>المبلغ</span><span id="c_amount"></span></div>
</div>

<div class="section">
<div class="row"><span>ملاحظات</span><span id="c_note"></span></div>
</div>

<div id="qrcode" class="center"></div>

<div class="center">شكراً لثقتك ❤️</div>

<div class="company-info">
<div><b>elsoooq</b></div>
<div>فيسبوك: <a href="https://www.facebook.com/elsoooqshop" target="_blank">facebook.com/elsoooqshop</a></div>
<div>هاتف / واتساب: 01022077100</div>
</div>

<button class="print" onclick="window.print()">طباعة</button>
<button class="pdf" onclick="downloadPDF()">PDF</button>
<button style="background:#25D366;color:#fff;" onclick="sendToCustomer()">واتساب</button>

// تحميل المحافظات
window.onload = function(){
for(let gov in egypt){
let option=document.createElement("option");
option.text=gov;
document.getElementById("gov").add(option);
}
}

// تحميل المراكز
function loadCities(){
let gov=document.getElementById("gov").value;
let city=document.getElementById("city");

city.innerHTML="";
if(!gov){return;}
egypt[gov].forEach(c=>{
let option=document.createElement("option");
option.text=c;
city.add(option);
});
}

// إنشاء بوليصة
function generate(){

let order="ORD"+Math.floor(100000+Math.random()*900000);

document.getElementById("invoice").style.display="block";

orderId.innerText=order;
c_name.innerText=name.value;
c_phone.innerText=phone.value;

c_address.innerText=gov.value+" - "+city.value+" - "+street.value;

c_product.innerText=product.value;
c_amount.innerText=amount.value+" جنيه";
c_note.innerText=note.value;

// QR
document.getElementById("qrcode").innerHTML="";
new QRCode(document.getElementById("qrcode"),{
text:"https://www.facebook.com/elsoooqshop",
width:100,
height:100
});
}

// PDF
function downloadPDF(){
html2pdf().from(document.getElementById("invoice")).save("elsoooq.pdf");
}

// واتساب — الإرسال دائماً إلى الرقم المحدد 01030630315
function sendToCustomer(){
let phoneNum="01030630315";
if(phoneNum.startsWith("0")) phoneNum="2"+phoneNum;

let msg="طلبك رقم: "+orderId.innerText;
window.open("https://wa.me/"+phoneNum+"?text="+encodeURIComponent(msg));
}
