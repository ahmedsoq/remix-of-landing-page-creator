
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بوليصة شحن - elsoooq</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
  
  <!-- مكتبات حفظ الصور والـ PDF بجودة فائقة وبصفحة واحدة فقط -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --primary-navy: #0e3b64;
      --accent-blue: #0288d1;
      --light-blue-bg: #eaf4fc;
      --border-blue: #b3d7f2;
      --text-dark: #1b2e4b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      background: #0f172a;
      min-height: 100vh;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 25px;
    }

    /* ================= لوحة الإدخال الزجاجية (Glassmorphism) ================= */
    .glass-control-panel {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      color: #fff;
    }

    .glass-control-panel h2 {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 8px;
      color: #38bdf8;
    }

    .btn-meta-gen {
      background: rgba(56, 189, 248, 0.2);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .f-group {
      margin-bottom: 9px;
    }

    .f-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 3px;
      color: #cbd5e1;
    }

    .g-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      padding: 7px 10px;
      color: #ffffff;
      font-size: 0.88rem;
      outline: none;
    }

    .g-input::placeholder {
      color: rgba(255, 255, 255, 0.38);
      font-size: 0.8rem;
    }

    .g-input:focus {
      border-color: #38bdf8;
      background: rgba(255, 255, 255, 0.14);
    }

    .f-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
    }

    .btn-action {
      border: none;
      border-radius: 8px;
      padding: 9px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: #fff;
    }

    .btn-print-act {
      grid-column: span 2;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      font-size: 0.95rem;
      padding: 11px;
    }

    .btn-img-act { background: linear-gradient(135deg, #059669, #047857); }
    .btn-pdf-act { background: linear-gradient(135deg, #dc2626, #b91c1c); }

    /* ================= بوليصة الشحن المطابقة بنسبة 100% ================= */
    .invoice-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: center;
    }

    .invoice-card {
      width: 480px;
      background: #ffffff;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
      direction: rtl;
    }

    /* رأس الفاتورة */
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      min-height: 110px;
      position: relative;
    }

    /* الشعار يسار الهيدر */
    .header-logo-side {
      padding: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .logo-main-text {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--primary-navy);
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .logo-main-text i {
      color: var(--accent-blue);
      font-size: 2rem;
    }

    .logo-slogan {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--primary-navy);
      margin-top: 4px;
    }

    /* بادج فاتورة بيع يمين الهيدر */
    .header-badge-side {
      background: var(--primary-navy);
      color: #ffffff;
      padding: 14px 22px 14px 28px;
      border-bottom-left-radius: 48px;
      min-width: 200px;
      text-align: right;
    }

    .header-badge-side h1 {
      font-size: 1.65rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .header-badge-side .meta-row {
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .invoice-body {
      padding: 12px 16px 8px 16px;
    }

    /* الكروت ذات البادج المائل */
    .data-box-card {
      border: 1.5px solid var(--border-blue);
      border-radius: 12px;
      padding: 14px 16px 12px 16px;
      margin-bottom: 14px;
      position: relative;
      background: #ffffff;
    }

    .card-slant-badge {
      position: absolute;
      top: -14px;
      right: 18px;
      background: var(--primary-navy);
      color: #ffffff;
      padding: 2px 22px 2px 30px;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 12px 100%);
      border-radius: 0 10px 0 0;
      font-size: 0.88rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* بيانات العميل */
    .client-details-grid {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .client-text-rows {
      flex: 1;
    }

    .client-single-row {
      display: flex;
      align-items: center;
      font-size: 0.92rem;
      margin-bottom: 4px;
    }

    .client-single-row:last-child { margin-bottom: 0; }

    .client-single-row .lbl {
      width: 95px;
      font-weight: 800;
      color: var(--primary-navy);
    }

    .client-single-row .val {
      font-weight: 700;
      color: #222;
      word-break: break-word;
    }

    .client-avatar-icon {
      background: var(--light-blue-bg);
      color: var(--primary-navy);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      margin-right: 15px;
      flex-shrink: 0;
    }

    /* تفاصيل الطلب */
    .order-details-grid {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px 2px 10px;
    }

    .order-sub-col {
      text-align: center;
      flex: 1;
    }

    .order-sub-col:first-child {
      border-left: 1px solid var(--border-blue);
    }

    .order-sub-col .col-head {
      font-weight: 800;
      font-size: 0.86rem;
      color: var(--primary-navy);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .order-sub-col .col-val {
      font-weight: 800;
      font-size: 0.9rem;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .bill-cash-50 {
      border: 1.5px solid var(--accent-blue);
      color: var(--accent-blue);
      border-radius: 3px;
      padding: 0 4px;
      font-size: 0.7rem;
      font-weight: 900;
      line-height: 1.2;
    }

    /* جدول الأصناف */
    .invoice-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
      border: 1.5px solid var(--border-blue);
      margin-bottom: 12px;
    }

    .invoice-table thead th {
      background: var(--primary-navy);
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 7px 4px;
      border-left: 1.5px solid rgba(255, 255, 255, 0.25);
    }

    .invoice-table thead th:last-child { border-left: none; }

    .invoice-table tbody td {
      padding: 9px 4px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #111;
      text-align: center;
      border-left: 1.5px solid var(--border-blue);
    }

    .invoice-table tbody td:last-child { border-left: none; }

    /* المبلغ الإجمالي */
    .total-split-banner {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
      background: var(--primary-navy);
      border: 1.5px solid var(--border-blue);
    }

    .total-right-navy {
      background: var(--primary-navy);
      color: white;
      padding: 9px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .total-left-light {
      flex: 1;
      background: var(--light-blue-bg);
      color: var(--primary-navy);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 16px;
      font-size: 1.35rem;
      font-weight: 900;
    }

    /* الملاحظة */
    .note-card-bar {
      border: 1.5px solid var(--border-blue);
      border-radius: 8px;
      padding: 8px 12px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--primary-navy);
      margin-bottom: 12px;
    }

    .note-tag-head {
      position: absolute;
      top: -12px;
      right: 18px;
      background: #ffffff;
      border: 1.5px solid var(--border-blue);
      border-radius: 12px;
      padding: 0 10px;
      font-size: 0.75rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* القسم السفلي: هاتف الشركة + المميزات + الختم الأصلي */
    .footer-extra-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1.5px dashed var(--border-blue);
      padding: 8px 0 4px 0;
    }

    .support-contact {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .support-circle-phone {
      background: var(--primary-navy);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .support-meta .s-title {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--primary-navy);
    }

    .support-meta .s-number {
      font-size: 0.84rem;
      font-weight: 900;
      color: #000;
      direction: ltr;
    }

    .perks-list-wrap {
      display: flex;
      gap: 12px;
    }

    .perk-box {
      text-align: center;
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--primary-navy);
    }

    .perk-box i {
      display: block;
      font-size: 1.1rem;
      margin-bottom: 2px;
      color: var(--primary-navy);
    }

    /* الختم الدائري المائل المطابق */
    .stamp-container-angle {
      width: 72px;
      height: 72px;
      border: 1.8px solid var(--primary-navy);
      border-radius: 50%;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-10deg);
      user-select: none;
    }

    .stamp-inner-circle {
      width: 100%;
      height: 100%;
      border: 1px dashed var(--primary-navy);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--primary-navy);
    }

    .stamp-txt-top { font-size: 0.54rem; font-weight: 900; line-height: 1; }
    .stamp-row-mid { display: flex; align-items: center; justify-content: center; gap: 3px; margin: 1px 0; }
    .stamp-row-mid .star { font-size: 0.38rem; }
    .stamp-row-mid i.fa-cart-shopping { font-size: 0.7rem; color: var(--accent-blue); }
    .stamp-brand { font-size: 0.62rem; font-weight: 900; line-height: 1; }
    .stamp-txt-bottom { font-size: 0.46rem; font-weight: 800; line-height: 1; }

    /* شريط الشكر السفلي */
    .bottom-curved-navy-bar {
      background: var(--primary-navy);
      color: white;
      padding: 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      border-top-left-radius: 20px;
    }

    .bottom-curved-navy-bar .thanks-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
    }

    .bottom-curved-navy-bar .thanks-block .th-txt {
      font-size: 1rem;
      font-weight: 800;
    }

    .bottom-curved-navy-bar .thanks-block .th-heart {
      font-size: 0.6rem;
      margin-top: 2px;
    }

    /* تجاوب الهاتف */
    @media screen and (max-width: 860px) {
      body {
        flex-direction: column;
        align-items: center;
        padding: 8px;
        gap: 15px;
      }
      .glass-control-panel, .invoice-container {
        max-width: 100%;
      }
      .invoice-card {
        width: 100%;
        max-width: 480px;
      }
    }

    /* ================= قواعد الطباعة الثابتة: صفحة واحدة فقط ================= */
    @page {
      size: A4 portrait;
      margin: 6mm auto;
    }

    @media print {
      html, body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: auto !important;
        min-height: auto !important;
        overflow: visible !important;
        display: block !important;
      }

      .glass-control-panel, .no-print {
        display: none !important;
      }

      .invoice-container {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 auto !important;
        padding: 0 !important;
        display: flex !important;
        justify-content: center !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
      }

      .invoice-card {
        width: 480px !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        border: 1px solid #ccc !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }
  </style>
</head>
<body>

  <!-- لوحة الإدخال الزجاجية (فارغة تماماً وجاهزة) -->
  <div class="glass-control-panel">
    <h2>
      <span><i class="fa-solid fa-pen-to-square"></i> بوليصة شحن جديدة</span>
      <button class="btn-meta-gen" onclick="generateMetaData()" title="توليد رقم وتاريخ جديد">
        <i class="fa-solid fa-arrows-rotate"></i> جديد
      </button>
    </h2>

    <div class="f-group">
      <label><i class="fa-solid fa-user"></i> اسم العميل</label>
      <input type="text" id="inCustName" class="g-input" placeholder="اكتب اسم العميل...">
    </div>

    <div class="f-group">
      <label><i class="fa-solid fa-phone"></i> تليفون العميل</label>
      <input type="tel" id="inCustPhone" class="g-input" placeholder="01xxxxxxxxx">
    </div>

    <div class="f-group">
      <label><i class="fa-solid fa-location-dot"></i> عنوان العميل</label>
      <input type="text" id="inCustAddress" class="g-input" placeholder="المدينة - المنطقة - الشارع...">
    </div>

    <div class="f-row">
      <div class="f-group">
        <label><i class="fa-solid fa-box-open"></i> النوع (اسم المنتج)</label>
        <input type="text" id="inProdName" class="g-input" placeholder="اسم المنتج...">
      </div>
      <div class="f-group">
        <label><i class="fa-solid fa-arrow-up-1-9"></i> العدد</label>
        <input type="number" id="inProdQty" class="g-input" placeholder="1" min="1">
      </div>
    </div>

    <div class="f-group">
      <label><i class="fa-solid fa-money-bill-wave"></i> مبلغ التحصيل (ج.م)</label>
      <input type="number" id="inTotalAmount" class="g-input" placeholder="المبلغ المطلوب تحصيله...">
    </div>

    <div class="f-group">
      <label><i class="fa-solid fa-comment-dots"></i> ملحوظة</label>
      <input type="text" id="inNote" class="g-input" placeholder="متاح معاينة المنتج قبل الدفع">
    </div>

    <!-- أزرار الإخراج الثلاثة -->
    <div class="btn-grid">
      <button type="button" class="btn-action btn-print-act" onclick="window.print()">
        <i class="fa-solid fa-print"></i> طباعة فورية (صفحة واحدة)
      </button>
      <button type="button" class="btn-action btn-img-act" onclick="saveAsImage()">
        <i class="fa-solid fa-image"></i> حفظ كصورة PNG
      </button>
      <button type="button" class="btn-action btn-pdf-act" onclick="saveAsPDF()">
        <i class="fa-solid fa-file-pdf"></i> حفظ كملف PDF
      </button>
    </div>
  </div>

  <!-- معاينة البوليصة المطابقة 100% -->
  <div class="invoice-container">
    <div class="invoice-card" id="invoiceCard">
      
      <!-- الهيدر -->
      <div class="header-top">
        
        <!-- اللوجو والسلوجان على اليسار -->
        <div class="header-logo-side">
          <div class="logo-main-text">
            <i class="fa-solid fa-cart-shopping"></i> elsoooq
          </div>
          <div class="logo-slogan">اختياراتك الأفضل .. دائماً</div>
        </div>

        <!-- بادج فاتورة بيع على اليمين -->
        <div class="header-badge-side">
          <h1>فاتورة بيع</h1>
          <div class="meta-row">
            رقم الفاتورة: <span id="outInvNumber">#000482</span>
          </div>
          <div class="meta-row">
            <i class="fa-regular fa-calendar-days"></i> التاريخ: <span id="outDate">2026-09-14</span>
          </div>
        </div>

      </div>

      <div class="invoice-body">
        
        <!-- كارت بيانات العميل -->
        <div class="data-box-card">
          <div class="card-slant-badge">
            <i class="fa-solid fa-user"></i> بيانات العميل
          </div>
          <div class="client-details-grid">
            <div class="client-text-rows">
              <div class="client-single-row">
                <span class="lbl">اسم العميل :</span>
                <span class="val" id="outCustName">---</span>
              </div>
              <div class="client-single-row">
                <span class="lbl">العنوان :</span>
                <span class="val" id="outCustAddress">---</span>
              </div>
              <div class="client-single-row">
                <span class="lbl">رقم الهاتف :</span>
                <span class="val" id="outCustPhone">---</span>
              </div>
            </div>
            <div class="client-avatar-icon">
              <i class="fa-solid fa-user"></i>
            </div>
          </div>
        </div>

        <!-- كارت تفاصيل الطلب -->
        <div class="data-box-card">
          <div class="card-slant-badge">
            <i class="fa-regular fa-clipboard"></i> تفاصيل الطلب
          </div>
          <div class="order-details-grid">
            <div class="order-sub-col">
              <div class="col-head">طريقة الدفع:</div>
              <div class="col-val">
                كاش عند الاستلام
                <span class="bill-cash-50">50</span>
              </div>
            </div>
            <div class="order-sub-col">
              <div class="col-head">
                تاريخ الطلب:
